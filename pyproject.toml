[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "optmem"
version = "0.1.0"
description = "Permanent, append-only memory for AI agents"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
memo = "optmem:main"
optchat = "optchat:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

# Package the standalone script without keeping a second copy of its code.
[tool.hatch.build.targets.wheel.force-include]
memo = "optmem.py"
"codex/plugins/optchat/scripts/optchat.py" = "optchat.py"
"codex/plugins/optchat/scripts/optchat_memory.py" = "optchat_memory.py"

[tool.hatch.build.targets.sdist]
include = ["memo", "pyproject.toml", "README.md", "WINDOWS.md", "install.sh", "test.py", "codex", "test_optchat.py"]
